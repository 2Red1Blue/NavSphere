name = "navsphere"
compatibility_date = "2024-11-11"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "content-os-feed"
database_id = "d6208293-c1bb-4607-8782-f9d37ab5989a"

# Secrets must be configured with `wrangler secret put`, never committed here.
# Example: wrangler secret put CONTENT_OS_API_KEY

[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "content-os-feed"
database_id = "d6208293-c1bb-4607-8782-f9d37ab5989a"

# Configure production variables in the Cloudflare dashboard and all sensitive
# values (AUTH_SECRET, GITHUB_PAT, OAuth secret, API keys) with Wrangler secrets.
